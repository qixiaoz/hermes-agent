name: Agent Hermes R2 CI audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

env:
  AUDITED_RUN_ID: '30886881081'
  CANDIDATE_SHA: 68357ac089d122556ae7c09b5f3cc2a9560b8bd2

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read every CI job and enforce code gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -sSfL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${AUDITED_RUN_ID}/jobs?per_page=100" \
            > /tmp/jobs.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/jobs.json').read_text())
          jobs = data['jobs']
          print(f"total_jobs={len(jobs)}")
          for job in jobs:
              print(f"{job['conclusion'] or job['status']:>12}  {job['name']}")

          by_name = {job['name']: job['conclusion'] for job in jobs}
          expected_success = {
              'Docs Site / docs-site-checks',
              'Python tests / e2e',
              'Python lints / ruff + ty diff',
              'Python lints / ruff enforcement (blocking)',
              'Python lints / Windows footguns (blocking)',
              'Check uv.lock / uv lock --check',
              'OSV scan / Scan lockfiles / osv-scan',
          }
          expected_success.update(
              f'Python tests / Run tests slice {i}/8' for i in range(1, 9)
          )
          missing_or_bad = {
              name: by_name.get(name) for name in expected_success
              if by_name.get(name) != 'success'
          }

          js_jobs = {
              name: result for name, result in by_name.items()
              if name.startswith('JS & TS checks /')
          }
          bad_js = {name: result for name, result in js_jobs.items() if result != 'success'}
          if len(js_jobs) < 2:
              print('Insufficient JS/TS job coverage:', js_jobs)
              raise SystemExit(1)

          failures = {
              name for name, result in by_name.items() if result == 'failure'
          }
          allowed_failures = {
              'Check contributors / check-attribution',
              'All required checks pass',
          }
          unexpected_failures = failures - allowed_failures

          print('missing_or_bad=', missing_or_bad)
          print('js_jobs=', js_jobs)
          print('bad_js=', bad_js)
          print('failures=', sorted(failures))
          print('unexpected_failures=', sorted(unexpected_failures))
          if missing_or_bad or bad_js or unexpected_failures:
              raise SystemExit(1)
          if by_name.get('Check contributors / check-attribution') != 'failure':
              raise SystemExit('expected attribution-only PR failure was not observed')
          print('AUDIT_OK: all code, test, docs, JS/TS and security gates passed; only attribution aggregate failed')
          PY
