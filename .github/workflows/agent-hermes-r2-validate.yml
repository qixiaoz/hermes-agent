name: Agent clean Hermes maintenance refs

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

env:
  PUBLISHED_MAIN: 657aa19fd0a746e2dc9983f50e601c8078fa945f
  UPSTREAM_SHA: 4075c8fd5ade673c93f757903b003ddc52603577

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify publication and remove temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_main=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          test "$remote_main" = "$PUBLISHED_MAIN"
          upstream_main=$(git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main | awk '{print $1}')
          test "$upstream_main" = "$UPSTREAM_SHA"

          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | grep -E '^(agent/|fork-maintenance/)' || true)
          printf 'Deleting %s temporary branches\n' "${#branches[@]}"
          for branch in "${branches[@]}"; do
            echo "delete $branch"
            encoded=${branch//\//%2F}
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done

          remaining=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | grep -E '^(agent/|fork-maintenance/)' || true)
          test -z "$remaining"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$PUBLISHED_MAIN"
