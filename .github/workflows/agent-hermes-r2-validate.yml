name: Agent Hermes final incremental gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CANDIDATE_SHA: 6250bb4980a9c3e849a51f0a4037225e07661732
  UPSTREAM_SHA: db0bd42119ae41e33b120aaecae89955f0898c24
  PREVIOUS_VALIDATED_UPSTREAM: 9076adaca58b3c3b1839c42228f97410ddb43722
  ORIGINAL_HEAD: 48401e2dfdfd060eadbcfecd479c98aafee14482
  CUSTOM_COUNT: '10'

jobs:
  incremental-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: 6250bb4980a9c3e849a51f0a4037225e07661732
          fetch-depth: 0

      - name: Verify topology and non-overlap with upstream increment
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main --no-tags
          test "$(git rev-parse upstream/main)" = "$UPSTREAM_SHA"
          test "$(git merge-base HEAD upstream/main)" = "$UPSTREAM_SHA"
          test "$(git rev-list --count upstream/main..HEAD)" = "$CUSTOM_COUNT"
          test "$(git rev-list --merges --count upstream/main..HEAD)" = 0
          git diff --check upstream/main..HEAD
          git diff --name-only "$PREVIOUS_VALIDATED_UPSTREAM..$UPSTREAM_SHA" | sort -u > /tmp/upstream-increment-files
          git diff --name-only "$UPSTREAM_SHA..$CANDIDATE_SHA" | sort -u > /tmp/custom-files
          echo 'Upstream increment:'; cat /tmp/upstream-increment-files
          echo 'Custom stack:'; cat /tmp/custom-files
          test ! -s <(comm -12 /tmp/upstream-increment-files /tmp/custom-files)

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Build identical candidate and upstream environments
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.11
          git worktree add --detach /tmp/hermes-upstream "$UPSTREAM_SHA"
          args=(--locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web)
          uv sync "${args[@]}"
          (cd /tmp/hermes-upstream && uv sync "${args[@]}")

      - name: Ruff and Windows guardrails
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run ruff check .
          uv run python scripts/check-windows-footguns.py --all

      - name: Equal-environment type delta
        shell: bash
        run: |
          set -Eeuo pipefail
          uv tool install 'ty==0.0.66'
          (cd /tmp/hermes-upstream && ty check --output-format gitlab --exit-zero > /tmp/type-upstream.json)
          ty check --output-format gitlab --exit-zero > /tmp/type-candidate.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = ['/tmp/hermes-upstream/', str(Path.cwd()) + '/']
          def load(path):
              out = set()
              for item in json.loads(Path(path).read_text()):
                  loc = item.get('location') or {}
                  filename = str(loc.get('path', '')).replace('\\', '/')
                  for root in roots:
                      filename = filename.replace(root, '')
                  out.add((filename, item.get('check_name', ''), item.get('description', '')))
              return out
          upstream = load('/tmp/type-upstream.json')
          candidate = load('/tmp/type-candidate.json')
          new = sorted(candidate - upstream)
          print(f'upstream={len(upstream)} candidate={len(candidate)} candidate-only={len(new)}')
          for item in new[:100]: print('NEW', item)
          if new: raise SystemExit(1)
          PY

      - name: Custom and upstream-increment Python regressions
        shell: bash
        env:
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: |
          set -Eeuo pipefail
          uv run pytest -q --tb=short \
            tests/gateway/ \
            tests/agent/test_credential_pool_lease_refresh_reselect.py \
            tests/honcho_plugin/test_async_memory.py \
            tests/hermes_cli/test_web_server_host_header.py \
            tests/hermes_cli/test_web_server_profile_unification.py \
            tests/tools/test_minimax_text_normalization.py \
            tests/tools/test_tts_speed.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: TUI checks for upstream text increment
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install -g npm@12
          npm ci
          npm run --prefix ui-tui check

      - name: Final ref lock
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch upstream main --no-tags
          test "$(git rev-parse upstream/main)" = "$UPSTREAM_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_HEAD"
          echo "FINAL_INCREMENTAL_GATE_OK=$CANDIDATE_SHA"
