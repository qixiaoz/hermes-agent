name: Hermes provenance-aware fork maintenance 2026-08-04

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

env:
  UPSTREAM_URL: https://github.com/NousResearch/hermes-agent.git
  UPSTREAM_SHA: 91937a6dc3ffbbe2f3be91a500f0ecf962c4cf53
  ORIGINAL_HEAD: 48401e2dfdfd060eadbcfecd479c98aafee14482
  ORIGINAL_MERGE_BASE: a4a91610b05acc75b4d76c077a5cd89c1ee066ba
  TARGET_BRANCH: main
  MAINT_BRANCH: fork-maintenance/hermes-provenance-20260804-1028
  CUSTOM_COUNT: '10'

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit and replay exact patch stack
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'qixiaoz-maintenance[bot]'
          git config user.email 'qixiaoz-maintenance[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main --no-tags
          test "$(git rev-parse upstream/main)" = "$UPSTREAM_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$ORIGINAL_HEAD"
          test "$(git merge-base "$ORIGINAL_HEAD" "$UPSTREAM_SHA")" = "$ORIGINAL_MERGE_BASE"

          mapfile -t commits < <(git rev-list --reverse "$ORIGINAL_MERGE_BASE..$ORIGINAL_HEAD")
          test "${#commits[@]}" = "$CUSTOM_COUNT"
          : > /tmp/original-subjects
          : > /tmp/original-patchids
          for commit in "${commits[@]}"; do
            subject=$(git show -s --format='%s' "$commit")
            patch_id=$(git show "$commit" | git patch-id --stable | awk '{print $1}')
            printf '%s %s %s\n' "$commit" "$patch_id" "$subject"
            printf '%s\n' "$subject" >> /tmp/original-subjects
            printf '%s\n' "$patch_id" >> /tmp/original-patchids
          done
          git cherry -v "$UPSTREAM_SHA" "$ORIGINAL_HEAD" | tee /tmp/cherry
          test "$(wc -l < /tmp/cherry)" = "$CUSTOM_COUNT"
          ! grep -q '^-' /tmp/cherry

          git checkout -B maintenance-candidate "$ORIGINAL_HEAD"
          set +e
          git rebase --onto "$UPSTREAM_SHA" "$ORIGINAL_MERGE_BASE"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "REBASE_EXIT_CODE=$rc"
            git diff --name-only --diff-filter=U || true
            git status --short || true
            git rebase --show-current-patch || true
            git rebase --abort || true
            exit 22
          fi

          candidate=$(git rev-parse HEAD)
          test "$(git merge-base "$UPSTREAM_SHA" "$candidate")" = "$UPSTREAM_SHA"
          test "$(git rev-list --count "$UPSTREAM_SHA..$candidate")" = "$CUSTOM_COUNT"
          test "$(git rev-list --merges "$UPSTREAM_SHA..$candidate" | wc -l)" = 0
          : > /tmp/candidate-subjects
          : > /tmp/candidate-patchids
          while read -r commit; do
            printf '%s\n' "$(git show -s --format='%s' "$commit")" >> /tmp/candidate-subjects
            git show "$commit" | git patch-id --stable | awk '{print $1}' >> /tmp/candidate-patchids
          done < <(git rev-list --reverse "$UPSTREAM_SHA..$candidate")
          diff -u /tmp/original-subjects /tmp/candidate-subjects
          diff -u /tmp/original-patchids /tmp/candidate-patchids
          git range-diff "$ORIGINAL_MERGE_BASE..$ORIGINAL_HEAD" "$UPSTREAM_SHA..$candidate"
          git diff --check "$UPSTREAM_SHA..$candidate"
          git diff --name-only "$UPSTREAM_SHA..$candidate" > /tmp/custom-touched-files
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$candidate"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Create locked upstream, original-fork, and candidate environments
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.11
          git worktree add --detach /tmp/hermes-upstream "$UPSTREAM_SHA"
          git worktree add --detach /tmp/hermes-original "$ORIGINAL_HEAD"
          args=(--locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web)
          (cd /tmp/hermes-upstream && uv sync "${args[@]}")
          (cd /tmp/hermes-original && uv sync "${args[@]}")
          (cd "$GITHUB_WORKSPACE" && uv sync "${args[@]}")

      - name: Native Ruff and guardrails
        run: |
          set -Eeuo pipefail
          uv run ruff check .
          uv run python scripts/check-windows-footguns.py --all

      - name: Three-way type diagnostic provenance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          uv tool install 'ty==0.0.66'
          (cd /tmp/hermes-upstream && ty check --output-format gitlab --exit-zero > /tmp/type-upstream.json)
          (cd /tmp/hermes-original && ty check --output-format gitlab --exit-zero > /tmp/type-original.json)
          (cd "$GITHUB_WORKSPACE" && ty check --output-format gitlab --exit-zero > /tmp/type-candidate.json)
          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = ['/tmp/hermes-upstream/', '/tmp/hermes-original/', str(Path.cwd()) + '/']
          def load(path):
              data = json.loads(Path(path).read_text())
              out = set()
              for item in data:
                  loc = item.get('location') or {}
                  filename = str(loc.get('path', '')).replace('\\', '/')
                  for root in roots:
                      filename = filename.replace(root, '')
                  out.add((filename, item.get('check_name', ''), item.get('description', '')))
              return out

          upstream = load('/tmp/type-upstream.json')
          original = load('/tmp/type-original.json')
          candidate = load('/tmp/type-candidate.json')
          new = sorted(candidate - (upstream | original))
          touched = set(Path('/tmp/custom-touched-files').read_text().splitlines())
          touched_new = [x for x in new if x[0] in touched]
          print(f'upstream={len(upstream)} original={len(original)} candidate={len(candidate)}')
          print(f'new-after-replay={len(new)} touched-new={len(touched_new)}')
          for item in new[:100]: print('NEW', item)
          if new or touched_new:
              raise SystemExit(1)
          PY

      - name: Run full Python tests
        env:
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
          HERMES_TEST_WORKERS: '4'
        run: |
          set -Eeuo pipefail
          source .venv/bin/activate
          python scripts/run_tests_parallel.py -q --tb=short

      - name: Run end-to-end tests
        env:
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: JavaScript TypeScript and desktop build
        run: |
          set -Eeuo pipefail
          npm install -g npm@12
          npm ci
          npm run check
          npm run build --workspace apps/desktop

      - name: Recheck refs and publish with exact lease
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch upstream main --no-tags
          end_upstream=$(git rev-parse upstream/main)
          remote_before=$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')
          printf 'END_UPSTREAM=%s\nREMOTE_BEFORE=%s\nCANDIDATE=%s\n' "$end_upstream" "$remote_before" "$CANDIDATE_SHA"
          test "$end_upstream" = "$UPSTREAM_SHA"
          test "$remote_before" = "$ORIGINAL_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$ORIGINAL_HEAD" origin "$CANDIDATE_SHA:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')" = "$CANDIDATE_SHA"

      - name: Remove temporary branch
        if: always()
        run: git push origin --delete "$MAINT_BRANCH" || true
