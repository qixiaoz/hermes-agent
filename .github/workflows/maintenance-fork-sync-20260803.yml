name: Fork maintenance audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit, replay, validate, and publish with lease
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_FORK: 15928a48d266d8811c17a72256b1715b2f41e8a3
          EXPECTED_UPSTREAM: d0b87dad77944c669b453385bb797d53fa33c4f7
          CLEANUP_BRANCH: maintenance-fork-sync-20260803
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            rc=$?
            echo "FINAL_RC=$rc"
            echo "REMOTE_MAIN=$(git ls-remote origin refs/heads/main | cut -f1)"
            echo "UPSTREAM_END=$(git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main | cut -f1)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${CLEANUP_BRANCH}" || true
            exit $rc
          }
          trap cleanup EXIT

          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --prune origin main
          git fetch --prune upstream main
          fork_head=$(git rev-parse origin/main)
          upstream_head=$(git rev-parse upstream/main)
          base=$(git merge-base origin/main upstream/main)
          read behind ahead < <(git rev-list --left-right --count upstream/main...origin/main)
          echo "FORK_ORIGINAL=$fork_head"
          echo "UPSTREAM_START=$upstream_head"
          echo "MERGE_BASE=$base"
          echo "AHEAD=$ahead BEHIND=$behind"
          test "$fork_head" = "$EXPECTED_FORK"
          test "$upstream_head" = "$EXPECTED_UPSTREAM"

          echo '--- CUSTOM COMMITS ---'
          git log --reverse --format='%H%x09%s' "$base"..origin/main
          echo '--- GIT CHERRY ---'
          git cherry -v upstream/main origin/main
          if git cherry upstream/main origin/main | grep -q '^-'; then
            echo 'BLOCKED: upstream contains patch-id equivalent custom commit'
            exit 40
          fi
          echo '--- STABLE PATCH IDS ---'
          while read -r c; do
            printf '%s ' "$c"
            git show "$c" --pretty=format: | git patch-id --stable
          done < <(git rev-list --reverse "$base"..origin/main)

          git config user.name qixiaoz-maintenance
          git config user.email qixiaoz-maintenance@users.noreply.github.com
          git switch -c maintenance-candidate origin/main
          git rebase --onto upstream/main "$base"
          candidate=$(git rev-parse HEAD)
          echo "CANDIDATE_HEAD=$candidate"
          test "$(git rev-list --count upstream/main..HEAD)" -eq "$ahead"
          test "$(git rev-list --merges --count upstream/main..HEAD)" -eq 0
          test "$(git merge-base HEAD upstream/main)" = "$upstream_head"

          uv sync --all-extras --dev
          uv run pytest -q
          uv run ruff check .
          if uv run basedpyright --version >/dev/null 2>&1; then
            uv run basedpyright
          elif uv run pyright --version >/dev/null 2>&1; then
            uv run pyright
          else
            echo 'BLOCKED: no BasedPyright/Pyright command available'
            exit 41
          fi

          while IFS= read -r pkg; do
            dir=$(dirname "$pkg")
            echo "Validating Node project: $dir"
            pushd "$dir"
            if [[ -f package-lock.json ]]; then npm ci; else npm install --ignore-scripts; fi
            npm run typecheck --if-present
            npm run build --if-present
            popd
          done < <(find . -name package.json -not -path '*/node_modules/*' -not -path './.venv/*' -print)

          upstream_end=$(git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main | cut -f1)
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "UPSTREAM_PREPUBLISH=$upstream_end"
          echo "REMOTE_MAIN_PREPUBLISH=$remote_main"
          test "$upstream_end" = "$upstream_head"
          test "$remote_main" = "$fork_head"
          git push origin HEAD:main --force-with-lease=refs/heads/main:"$fork_head"
          echo "PUBLISHED_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)"
