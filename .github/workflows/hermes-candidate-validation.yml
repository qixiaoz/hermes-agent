name: Hermes candidate follow-up validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: read

env:
  CANDIDATE_SHA: b22e3335aa0717d6c5b285b116cde9bfde075e4c
  PINNED_UPSTREAM: a4a91610b05acc75b4d76c077a5cd89c1ee066ba
  ORIGINAL_HEAD: 15928a48d266d8811c17a72256b1715b2f41e8a3
  CANDIDATE_BRANCH: fork-maintenance/hermes-manual-20260803

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Verify pinned refs and clean linear stack
        run: |
          set -Eeuo pipefail
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main --no-tags
          test "$(git rev-parse upstream/main)" = "$PINNED_UPSTREAM"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_HEAD"
          test "$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git rev-list --count "$PINNED_UPSTREAM..$CANDIDATE_SHA")" = 10
          test "$(git rev-list --merges "$PINNED_UPSTREAM..$CANDIDATE_SHA" | wc -l)" = 0
          git diff --check "$PINNED_UPSTREAM..$CANDIDATE_SHA"

  quality-diff:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
      - name: Blocking Ruff and Windows guardrails
        run: |
          uv tool install ruff
          ruff check .
          python scripts/check-windows-footguns.py --all
      - name: Require no new ty diagnostics versus pinned upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          uv tool install ty
          mkdir -p .type-reports
          git worktree add --detach /tmp/hermes-upstream "$PINNED_UPSTREAM"
          (
            cd /tmp/hermes-upstream
            ty check --output-format gitlab --exit-zero > "$GITHUB_WORKSPACE/.type-reports/base.json"
          )
          ty check --output-format gitlab --exit-zero > .type-reports/head.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path: str):
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              assert isinstance(data, list)
              return data

          def key(item):
              location = item.get("location") or {}
              path = location.get("path", "")
              return (
                  path,
                  item.get("check_name", "unknown"),
                  item.get("description", ""),
              )

          base = {key(item): item for item in load(".type-reports/base.json")}
          head = {key(item): item for item in load(".type-reports/head.json")}
          new = sorted(set(head) - set(base))
          fixed = sorted(set(base) - set(head))
          print(f"upstream diagnostics={len(base)} candidate diagnostics={len(head)}")
          print(f"new={len(new)} fixed={len(fixed)}")
          for path, rule, message in new[:50]:
              print(f"NEW {path} [{rule}] {message}")
          if new:
              raise SystemExit(1)
          PY

  locked-install:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv python install 3.11
      - name: Verify supported locked installation path
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web
      - name: Import smoke test
        run: |
          uv run python - <<'PY'
          import hermes_cli.models
          import hermes_cli.web_server
          import plugins.memory.honcho.session
          import tools.tts_tool
          print("candidate imports succeeded")
          PY

  validation-gate:
    if: always()
    needs: [audit, quality-diff, locked-install]
    runs-on: ubuntu-latest
    steps:
      - name: Require follow-up lanes
        env:
          AUDIT: ${{ needs.audit.result }}
          QUALITY: ${{ needs.quality-diff.result }}
          INSTALL: ${{ needs.locked-install.result }}
        run: |
          printf 'audit=%s quality=%s install=%s\n' "$AUDIT" "$QUALITY" "$INSTALL"
          test "$AUDIT" = success
          test "$QUALITY" = success
          test "$INSTALL" = success
