name: Maintain fork patch stack

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
      timezone: "America/Los_Angeles"

concurrency:
  group: fork-maintenance
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET_BRANCH: "main"
  UPSTREAM_URL: "https://github.com/NousResearch/hermes-agent.git"
  UPSTREAM_BRANCH: "main"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      needs_update: ${{ steps.preflight.outputs.needs_update }}
      original_head: ${{ steps.preflight.outputs.original_head }}
      upstream_head: ${{ steps.preflight.outputs.upstream_head }}
      upstream_ref: ${{ steps.preflight.outputs.upstream_ref }}
      workflow_blob: ${{ steps.preflight.outputs.workflow_blob }}
      reason: ${{ steps.preflight.outputs.reason }}
      expected_tree: ${{ steps.package.outputs.expected_tree }}
    steps:
      - name: Checkout maintained branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect upstream and audit state
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git config user.name "fork-maintenance[bot]"
          /usr/bin/git config user.email "fork-maintenance[bot]@users.noreply.github.com"
          /usr/bin/git remote add upstream "$UPSTREAM_URL" 2>/dev/null || \
            /usr/bin/git remote set-url upstream "$UPSTREAM_URL"
          /usr/bin/git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          /usr/bin/git fetch --no-tags origin \
            "+refs/heads/maintenance/upstream-base:refs/remotes/origin/maintenance/upstream-base" \
            || true
          /usr/bin/git fetch --no-tags origin \
            "+refs/heads/maintenance/audited-head:refs/remotes/origin/maintenance/audited-head" \
            || true

          original_head="$(/usr/bin/git rev-parse HEAD)"
          upstream_ref="upstream/$UPSTREAM_BRANCH"
          upstream_head="$(/usr/bin/git rev-parse "$upstream_ref")"
          workflow_blob="$(/usr/bin/git rev-parse "$original_head:.github/workflows/fork-maintenance.yml")"
          state_upstream="$(/usr/bin/git rev-parse --verify refs/remotes/origin/maintenance/upstream-base 2>/dev/null || true)"
          state_audited="$(/usr/bin/git rev-parse --verify refs/remotes/origin/maintenance/audited-head 2>/dev/null || true)"
          reasons=()

          [[ "$state_upstream" == "$upstream_head" ]] || reasons+=("upstream changed or first run")
          [[ "$state_audited" == "$original_head" ]] || reasons+=("local patch stack changed or first run")
          /usr/bin/git merge-base --is-ancestor "$upstream_ref" HEAD || reasons+=("upstream tip is not an ancestor")
          if /usr/bin/git rev-list --merges "$upstream_ref"..HEAD | grep -q .; then
            reasons+=("merge commits exist above upstream")
          fi
          if /usr/bin/git cherry "$upstream_ref" HEAD | grep -q '^-'; then
            reasons+=("upstream-equivalent patches still exist")
          fi

          if (( ${#reasons[@]} == 0 )); then
            needs_update=false
          else
            needs_update=true
          fi
          reason="$(IFS='; '; echo "${reasons[*]:-none}")"

          {
            echo "needs_update=$needs_update"
            echo "original_head=$original_head"
            echo "upstream_head=$upstream_head"
            echo "upstream_ref=$upstream_ref"
            echo "workflow_blob=$workflow_blob"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Fork maintenance preflight"
            echo "- Target: \`$TARGET_BRANCH@$original_head\`"
            echo "- Upstream: \`$upstream_ref@$upstream_head\`"
            echo "- Agent run required: \`$needs_update\`"
            echo "- Reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save pre-rewrite backup
        if: steps.preflight.outputs.needs_update == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ steps.preflight.outputs.original_head }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          /usr/bin/git -c core.hooksPath=/dev/null push \
            "$remote" "$ORIGINAL_HEAD:refs/heads/maintenance/backup" --force

      - name: Require Codex API credential
        if: steps.preflight.outputs.needs_update == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Add an OPENAI_API_KEY Actions secret before enabling fork maintenance."
            exit 1
          fi

      - name: Rebuild and audit the patch stack
        id: codex
        if: steps.preflight.outputs.needs_update == 'true'
        uses: openai/codex-action@v1
        env:
          FORK_MAINTENANCE_ORIGINAL_HEAD: ${{ steps.preflight.outputs.original_head }}
          FORK_MAINTENANCE_UPSTREAM_REF: ${{ steps.preflight.outputs.upstream_ref }}
          FORK_MAINTENANCE_UPSTREAM_HEAD: ${{ steps.preflight.outputs.upstream_head }}
          FORK_MAINTENANCE_TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          FORK_MAINTENANCE_WORKFLOW_BLOB: ${{ steps.preflight.outputs.workflow_blob }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          effort: high
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          output-file: codex-output.md
          prompt: |
            You are the semantic maintainer of a long-lived fork. Read the
            FORK_MAINTENANCE_* environment variables with the shell before doing
            anything; their values are authoritative.

            Rebuild the checked-out maintained branch as a clean, linear patch
            stack rooted directly at the exact fetched official upstream tip.
            Do not merely merge upstream.

            Required policy:
            1. Every fork-only commit must be above the upstream tip.
            2. If upstream already implements the same behavior or fix, drop the
               fork patch instead of retaining a duplicate.
            3. If upstream changes conflict with a fork feature, adapt the fork
               implementation to the current upstream architecture while
               preserving the feature's observable behavior.
            4. Each functional feature or fix must map to exactly one commit.
               Combine scattered commits for the same topic; split mixed commits.
               Keep code, tests, and directly related docs for one topic together.
            5. Use specific conventional-style subjects such as feat(scope): ...,
               fix(scope): ..., refactor(scope): ..., or chore(scope): ....
            6. Preserve .github/workflows/fork-maintenance.yml byte-for-byte from
               the original head, and keep it in one atomic maintenance commit.
               Recover it with git show after any reset.

            Work method:
            - First read AGENTS.md and repository contributor/build instructions.
            - Treat old commit messages as clues, not ground truth. Inspect the
              old history, net diff, tests, and current upstream implementation
              with git log, git diff, git cherry, and git range-diff where useful.
            - Enumerate every distinct fork behavior before rewriting history.
            - Prove an absorbed feature from current upstream code and tests before
              dropping it.
            - Reconstruct the branch from the fetched upstream ref rather than
              preserving historical merge commits.
            - Resolve conflicts semantically; never choose ours/theirs blindly.
            - Add or update focused tests when adaptation changes implementation.
            - Run the repository's relevant formatter, lint/type checks, targeted
              tests, and a practical broader test command documented by the repo.
            - Review the final diff and every commit one more time for atomicity,
              duplication, accidental deletions, and behavior regressions.

            Hard constraints:
            - The exact upstream tip must be an ancestor of HEAD.
            - No merge, empty, fixup, squash, or WIP commits above upstream.
            - No upstream-equivalent patch may remain.
            - Leave the target branch checked out with a clean worktree.
            - Do not push, edit remote refs, alter this workflow file, weaken
              tests, or disable functionality.
            - Your final response must list kept, modified, merged/split, and
              dropped topics, the final commit subjects, and all tests run.

      - name: Record Codex report
        if: steps.preflight.outputs.needs_update == 'true' && always()
        shell: bash
        run: |
          if [[ -f codex-output.md ]]; then
            {
              echo "### Codex maintenance report"
              cat codex-output.md
            } >> "$GITHUB_STEP_SUMMARY"
            /bin/rm -f codex-output.md
          fi

      - name: Verify rewritten history
        if: steps.preflight.outputs.needs_update == 'true'
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.preflight.outputs.upstream_ref }}
          UPSTREAM_HEAD: ${{ steps.preflight.outputs.upstream_head }}
          WORKFLOW_BLOB: ${{ steps.preflight.outputs.workflow_blob }}
        run: |
          set -euo pipefail
          [[ "$(/usr/bin/git symbolic-ref --short HEAD)" == "$TARGET_BRANCH" ]]
          /usr/bin/git diff --quiet
          /usr/bin/git diff --cached --quiet
          /usr/bin/git merge-base --is-ancestor "$UPSTREAM_REF" HEAD
          [[ "$(/usr/bin/git merge-base HEAD "$UPSTREAM_REF")" == "$UPSTREAM_HEAD" ]]
          [[ -z "$(/usr/bin/git rev-list --merges "$UPSTREAM_REF"..HEAD)" ]]
          ! /usr/bin/git cherry "$UPSTREAM_REF" HEAD | grep -q '^-'
          [[ "$(/usr/bin/git rev-parse "HEAD:.github/workflows/fork-maintenance.yml")" == "$WORKFLOW_BLOB" ]]

          while read -r commit; do
            [[ -n "$commit" ]] || continue
            parent="$(/usr/bin/git rev-parse "$commit^")"
            if /usr/bin/git diff-tree --quiet "$parent" "$commit"; then
              echo "::error::Empty commit: $commit"
              exit 1
            fi
            subject="$(/usr/bin/git show -s --format=%s "$commit")"
            if [[ -z "$subject" || "$subject" == Merge* || "$subject" == WIP* || "$subject" == fixup\!* || "$subject" == squash\!* ]]; then
              echo "::error::Unclear or temporary commit subject: $subject"
              exit 1
            fi
          done < <(/usr/bin/git rev-list --reverse "$UPSTREAM_REF"..HEAD)

      - name: Package verified patch stack
        id: package
        if: steps.preflight.outputs.needs_update == 'true'
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.preflight.outputs.upstream_ref }}
        run: |
          set -euo pipefail
          /usr/bin/git format-patch --binary --stdout "$UPSTREAM_REF"..HEAD > fork-maintenance.mbox
          expected_tree="$(/usr/bin/git rev-parse 'HEAD^{tree}')"
          echo "expected_tree=$expected_tree" >> "$GITHUB_OUTPUT"

      - name: Upload verified patch stack
        if: steps.preflight.outputs.needs_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fork-maintenance-patches
          path: fork-maintenance.mbox
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: needs.prepare.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout original target
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.original_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified patch stack
        uses: actions/download-artifact@v4
        with:
          name: fork-maintenance-patches

      - name: Reconstruct in a clean runner
        shell: bash
        env:
          UPSTREAM_HEAD: ${{ needs.prepare.outputs.upstream_head }}
          WORKFLOW_BLOB: ${{ needs.prepare.outputs.workflow_blob }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.expected_tree }}
        run: |
          set -euo pipefail
          /usr/bin/git remote add upstream "$UPSTREAM_URL" 2>/dev/null || \
            /usr/bin/git remote set-url upstream "$UPSTREAM_URL"
          /usr/bin/git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          [[ "$(/usr/bin/git rev-parse "upstream/$UPSTREAM_BRANCH")" == "$UPSTREAM_HEAD" ]]

          /usr/bin/git config --local core.hooksPath /dev/null
          /usr/bin/git config --local user.name "fork-maintenance[bot]"
          /usr/bin/git config --local user.email "fork-maintenance[bot]@users.noreply.github.com"
          /usr/bin/git checkout -B "$TARGET_BRANCH" "$UPSTREAM_HEAD"
          /usr/bin/git am --3way fork-maintenance.mbox

          /usr/bin/git diff --quiet
          /usr/bin/git diff --cached --quiet
          /usr/bin/git merge-base --is-ancestor "$UPSTREAM_HEAD" HEAD
          [[ "$(/usr/bin/git merge-base HEAD "$UPSTREAM_HEAD")" == "$UPSTREAM_HEAD" ]]
          [[ -z "$(/usr/bin/git rev-list --merges "$UPSTREAM_HEAD"..HEAD)" ]]
          ! /usr/bin/git cherry "$UPSTREAM_HEAD" HEAD | grep -q '^-'
          [[ "$(/usr/bin/git rev-parse 'HEAD^{tree}')" == "$EXPECTED_TREE" ]]
          [[ "$(/usr/bin/git rev-parse "HEAD:.github/workflows/fork-maintenance.yml")" == "$WORKFLOW_BLOB" ]]

      - name: Publish maintained branch and audit refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ needs.prepare.outputs.original_head }}
          UPSTREAM_HEAD: ${{ needs.prepare.outputs.upstream_head }}
        run: |
          set -euo pipefail
          new_head="$(/usr/bin/git rev-parse HEAD)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          /usr/bin/git -c core.hooksPath=/dev/null push \
            "$remote" "HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$ORIGINAL_HEAD"
          /usr/bin/git -c core.hooksPath=/dev/null push \
            "$remote" "$UPSTREAM_HEAD:refs/heads/maintenance/upstream-base" --force
          /usr/bin/git -c core.hooksPath=/dev/null push \
            "$remote" "$new_head:refs/heads/maintenance/audited-head" --force
          echo "Updated \`$TARGET_BRANCH\` to \`$new_head\`." >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [prepare, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Update maintenance status issue
        uses: actions/github-script@v7
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          NEEDS_UPDATE: ${{ needs.prepare.outputs.needs_update }}
          PREFLIGHT_REASON: ${{ needs.prepare.outputs.reason }}
        with:
          script: |
            const title = "[fork-maintenance] needs attention";
            const ok =
              process.env.PREPARE_RESULT === "success" &&
              (process.env.NEEDS_UPDATE !== "true" ||
               process.env.PUBLISH_RESULT === "success");
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const issues = found.data.items.filter(item => item.title === title);

            if (ok) {
              for (const item of issues) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  state: "closed"
                });
              }
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled upstream refresh could not safely publish a rewritten patch stack.",
              "",
              `- Run: ${runUrl}`,
              `- Target branch: \`${process.env.TARGET_BRANCH}\``,
              `- Reason for refresh: ${process.env.PREFLIGHT_REASON || "see workflow log"}`,
              "",
              "The previous branch tip is preserved at `maintenance/backup`."
            ].join("\n");

            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
