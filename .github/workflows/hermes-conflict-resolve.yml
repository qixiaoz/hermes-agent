name: Hermes conflict resolve
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase and capture conflict
        shell: bash
        env:
          PINNED_UPSTREAM: a979ca2a67a6fe3c08dd97a10ec6131aca913c14
          ORIGINAL_HEAD: e4a71418352300209e6cdc6b32bcfb61ae330972
          OLD_BASE: 60ec6a3b8ee147406ecb1ab1bab9cec673995ad7
        run: |
          set -Eeuo pipefail
          git config user.name 'qixiaoz-maintenance[bot]'
          git config user.email 'qixiaoz-maintenance[bot]@users.noreply.github.com'
          HEAD_BRANCH="$GITHUB_HEAD_REF"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main --no-tags
          git fetch origin "$HEAD_BRANCH" --no-tags
          ACTUAL_UPSTREAM=$(git rev-parse upstream/main)
          HEAD_SHA=$(git rev-parse "origin/$HEAD_BRANCH")
          mkdir -p /tmp/conflicts
          if [ "$ACTUAL_UPSTREAM" != "$PINNED_UPSTREAM" ]; then
            printf 'status=upstream_changed\nhead_branch=%s\nhead_sha=%s\noriginal_head=%s\nupstream_head=%s\n' "$HEAD_BRANCH" "$HEAD_SHA" "$ORIGINAL_HEAD" "$ACTUAL_UPSTREAM" > /tmp/diag.md
          else
            git checkout -B candidate "$ORIGINAL_HEAD"
            set +e
            git rebase --onto "$PINNED_UPSTREAM" "$OLD_BASE"
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              git diff --name-only --diff-filter=U > /tmp/conflict-files.txt
              {
                echo 'status=conflict'
                echo "head_branch=$HEAD_BRANCH"
                echo "head_sha=$HEAD_SHA"
                echo "original_head=$ORIGINAL_HEAD"
                echo "upstream_head=$ACTUAL_UPSTREAM"
                echo "rebase_head=$(cat .git/REBASE_HEAD 2>/dev/null || true)"
                echo 'conflict_files:'
                sed 's/^/- /' /tmp/conflict-files.txt
                echo 'git_status:'
                git status --short
              } > /tmp/diag.md
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                safe=$(printf '%s' "$f" | sed 's#/#__#g')
                cp "$f" "/tmp/conflicts/$safe"
              done < /tmp/conflict-files.txt
              git rebase --abort || true
            else
              CANDIDATE=$(git rev-parse HEAD)
              {
                echo 'status=success'
                echo "head_branch=$HEAD_BRANCH"
                echo "head_sha=$HEAD_SHA"
                echo "original_head=$ORIGINAL_HEAD"
                echo "upstream_head=$ACTUAL_UPSTREAM"
                echo "candidate_head=$CANDIDATE"
              } > /tmp/diag.md
            fi
          fi
          git checkout -B diagnostic "origin/$HEAD_BRANCH"
          mkdir -p .github/maintenance-diagnostics/hermes-conflicts
          cp /tmp/diag.md .github/maintenance-diagnostics/hermes-rebase.md
          cp -R /tmp/conflicts/. .github/maintenance-diagnostics/hermes-conflicts/ 2>/dev/null || true
          git add .github/maintenance-diagnostics
          git commit -m 'chore: capture hermes rebase diagnostics'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
